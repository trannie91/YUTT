name: Build Cloudstream Extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Extension .cs3 with Gradle
        run: |
          gradle make --no-daemon --stacktrace || gradle build --no-daemon --stacktrace

      - name: Prepare Artifacts for Deploy
        run: |
          mkdir -p build
          find . -name "*.cs3" -exec cp -fv {} build/ \; || true
          find . -maxdepth 3 -name "plugins.json" -exec cp -fv {} build/ \; || true
          find . -maxdepth 3 -name "updater.json" -exec cp -fv {} build/ \; || true

          if [ ! -f "build/plugins.json" ]; then
            cat << 'EOF' > build/plugins.json
          [
            {
              "name": "yutt",
              "pluginClassName": "com.yutt.YuttPlugin",
              "description": "Kho phim YUTT - VKontakte & OK.ru Full HD 1080p",
              "version": 1,
              "author": "yutt",
              "tvTypes": ["TvSeries", "Movie", "AsianDrama"],
              "iconUrl": "https://www.yuthanhthien.top/favicon.ico",
              "url": "https://raw.githubusercontent.com/${{ github.repository }}/builds/Yutt.cs3"
            }
          ]
          EOF
          fi

          if [ ! -f "build/repo.json" ]; then
            cat << 'EOF' > build/repo.json
          {
            "name": "yutt",
            "description": "Kho phim YUTT - VKontakte & OK.ru Full HD 1080p",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF
          fi

          echo "Deployment folder contents:"
          ls -la build/

      - name: Deploy builds to Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: false
