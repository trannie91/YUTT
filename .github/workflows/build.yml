name: Build Cloudstream Extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Extension .cs3 with Gradle
        run: gradle make --no-daemon --stacktrace

      - name: Deploy builds to Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: false
